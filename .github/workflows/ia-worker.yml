name: IA Didactica Cloud Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema de la leccion'
        required: false
        default: 'Arquitectura de Microservicios'

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Crear directorio de lecciones
        run: mkdir -p lecciones

      - name: Ejecutar motor de leccion
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_TEMA: ${{ github.event.inputs.tema }}
        run: |
          TEMA="${INPUT_TEMA:-Arquitectura de Microservicios}"
          node src/core/orquestador.js "$TEMA"

      - name: Sello de Propiedad y Blindaje
        env:
          INPUT_TEMA: ${{ github.event.inputs.tema }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          PROPIETARIO="Ricardo Moran"
          BOT_ID="ricardomoranbot"
          HUELLA="chrome-mobile-es-419"
          EMAIL="moranricardo@users.noreply.github.com"
          FECHA_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          TEMA_INPUT="${INPUT_TEMA:-Arquitectura de Microservicios}"
          SLUG=$(echo "$TEMA_INPUT" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//')
          ARCHIVO="lecciones/${SLUG}.md"

          if [ ! -f "$ARCHIVO" ]; then
            ARCHIVO=$(ls -t lecciones/*.md 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$ARCHIVO" ] || [ ! -f "$ARCHIVO" ]; then
            echo "No hay archivos Markdown para sellar."
            exit 0
          fi

          git config --global user.name "$PROPIETARIO"
          git config --global user.email "$EMAIL"

          mkdir -p .github
          echo "* @moranricardo @$BOT_ID" > .github/CODEOWNERS

          cat << SELLO >> "$ARCHIVO"

---
## 🛡️ Sello de Propiedad Intelectual
**Propietario:** $PROPIETARIO
**Bot Custodio:** @$BOT_ID
**Huella:** \`$HUELLA\`
**Fecha:** $FECHA_ISO
**Run URL:** $RUN_URL
SELLO

          git add "$ARCHIVO" .github/CODEOWNERS
          if git diff --staged --quiet; then
            exit 0
          fi

          git pull --rebase origin main || true
          git commit -m "feat(leccion): blindaje y propiedad para $TEMA_INPUT [$SLUG]"
          git push origin main

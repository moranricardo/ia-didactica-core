name: IA Didactica Cloud Worker

on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema de la lección'
        required: true
        default: 'Arquitectura de Microservicios'

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Crear directorio de lecciones
        run: mkdir -p lecciones

      - name: Ejecutar motor de lección
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEMA: ${{ inputs.tema }}
        run: node src/core/orquestador.js "$TEMA"

      - name: Sello de Propiedad y Blindaje de Autoría
        env:
          TEMA_INPUT: ${{ inputs.tema }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          
          # --- HUELLA DE PROPIETARIO ---
          export PROPIETARIO="Ricardo Moran"
          export BOT_ID="ricardomoranbot"
          export HUELLA="chrome-mobile-es-419"
          export EMAIL="moranricardo@users.noreply.github.com"
          export FECHA_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          SLUG=$(echo "$TEMA_INPUT" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//')
          ARCHIVO="lecciones/${SLUG}.md"

          echo "🔍 Huella de origen: $HUELLA"
          echo "📄 Verificando archivo: $ARCHIVO"
          
          if [ ! -f "$ARCHIVO" ]; then
            echo "⚠️ Archivo no encontrado en la ruta esperada, buscando último archivo generado..."
            ARCHIVO=$(ls -t lecciones/*.md 2>/dev/null | head -n 1 || true)
            echo "📄 Usando archivo alternativo: $ARCHIVO"
          fi

          if [ -z "$ARCHIVO" ] || [ ! -f "$ARCHIVO" ]; then
            echo "❌ No se encontró ningún archivo generado en lecciones/"
            exit 1
          fi

          git config --global user.name "$PROPIETARIO (Bot Propietario)"
          git config --global user.email "$EMAIL"

          # Creación de CODEOWNERS para proteger la propiedad intelectual
          mkdir -p .github
          cat << CODE > .github/CODEOWNERS
# Sello de Propiedad Intelectual - $HUELLA
# Propietario: $PROPIETARIO

* @moranricardo @$BOT_ID
lecciones/* @moranricardo @$BOT_ID
.github/* @moranricardo @$BOT_ID
src/* @moranricardo @$BOT_ID
CODE

          # Sanitización de rutas y variables para el JSON
          SAFE_RUN_URL=$(echo "$RUN_URL" | sed 's/"/\\"/g')
          SAFE_ARCHIVO=$(echo "$ARCHIVO" | sed 's/"/\\"/g')

          # Inyección de sello de propiedad dentro de la lección generada
          cat << SELLO >> "$ARCHIVO"

---
## 🛡️ Sello de Propiedad Intelectual

**Propietario:** $PROPIETARIO
**Bot Custodio:** @$BOT_ID
**Huella de Dispositivo:** \`$HUELLA\`
**Origen:** IA-Didactica-Core Cloud Pipeline
**Generado:** $FECHA_ISO
**Workflow URL:** $RUN_URL
**Licencia:** MIT + Atribución Obligatoria a $PROPIETARIO

> Este documento está firmado digitalmente en la nube. Cualquier clon o uso sin esta huella es una copia no autorizada.

\`\`\`json
{
  "owner": "$PROPIETARIO",
  "bot": "$BOT_ID",
  "huella": "$HUELLA",
  "archivo": "$SAFE_ARCHIVO",
  "timestamp": "$FECHA_ISO",
  "runUrl": "$SAFE_RUN_URL"
}
\`\`\`
SELLO

          git add "$ARCHIVO" .github/CODEOWNERS

          if git diff --staged --quiet; then
            echo "Sin cambios pendientes de commit."
            exit 0
          fi

          git pull --rebase origin main || true
          git commit -m "feat(leccion): blindaje y propiedad para $TEMA_INPUT [$SLUG]

Propiedad Intelectual: $PROPIETARIO
Huella de Dispositivo: $HUELLA
Bot Custodio: @$BOT_ID
Origen CI: $RUN_URL
Fecha: $FECHA_ISO"

          git push origin main

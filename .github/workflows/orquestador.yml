name: Orquestador IA Cloud

on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema a generar'
        required: true
        default: 'Arquitectura de Microservicios'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Orquestador en la Nube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/core/orquestador.js "${{ github.event.inputs.tema || 'Arquitectura Autonoma' }}"

      - name: Guardar Lecciones Generadas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p lecciones
          git add lecciones/
          git commit -m "chore(ia): leccion generada automaticamente por la nube" || echo "Sin cambios para hacer commit"
          git pull --rebase origin main
          git push

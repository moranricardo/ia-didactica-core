name: Orquestador IA Cloud

on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema a generar'
        required: true
        default: 'Arquitectura de Microservicios'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Concede permisos explícitos de escritura para git push
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Orquestador en la Nube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/core/orquestador.js "${{ github.event.inputs.tema || 'Arquitectura Autónoma' }}"

      - name: Guardar Lecciones Generadas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lecciones/
          git commit -m "chore(ia): lección generada automáticamente por la nube" || exit 0
          git push

name: 🚀 CI/CD Orquestación Multi-Repositorio

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'lecciones/**'
      - 'modelo_maestro.json'

jobs:
  validacion-y-propagacion:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout del Repositorio Core
        uses: actions/checkout@v7

      - name: 🛡️ Verificación de Integridad y Custodia
        run: |
          echo "Verificando firmas de ecosistema..."
          echo "Custodio: @ricardomoranbot"
          # Validación básica de estructura de archivo JSON si existe
          if [ -f "modelo_maestro.json" ]; then
            python3 -m json.tool modelo_maestro.json > /dev/null
            echo "modelo_maestro.json es un JSON válido."
          fi

      - name: 📚 Validación Lexicográfica
        run: |
          echo "Verificando archivos de lecciones..."
          # Revisa que existan archivos en la carpeta lecciones
          ls -la lecciones/ || echo "Directorio lecciones listo."

      - name: 🔄 Sincronización y Dispatch Global
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cambios detectados en el núcleo. Propagando estado..."
          # Ejemplo de integración real con evento de despacho a otros repositorios:
          # curl -X POST -H "Authorization: token $GITHUB_TOKEN" \
          #   -H "Accept: application/vnd.github.v3+json" \
          #   https://api.github.com/repos/moranricardo/OTRO_REPO/dispatches \
          #   -d '{"event_type": "core_updated"}'